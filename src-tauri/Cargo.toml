[package]
name = "pi-desktop"
version = "0.1.0"
description = "Pi Desktop - a desktop frontend for the Pi coding agent, in the spirit of opencode"
authors = ["you"]
edition = "2021"

[lib]
name = "pi_desktop_lib"
# Desktop-only app: plain rlib. (staticlib/cdylib are for mobile builds and blow
# up the mingw PE export table — "export ordinal too large".)
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
